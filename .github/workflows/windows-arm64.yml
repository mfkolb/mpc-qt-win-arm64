name: Msys2 CI (ARM64)

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  DEVBUILD: continuous
  MPCQT_SUFFIX: win-arm64

jobs:
  build:
    name: Build (Windows ARM64)
    runs-on: windows-11-arm
    defaults:
      run:
        shell: msys2 {0}

    steps:
    - name: Install packages
      uses: msys2/setup-msys2@v2
      with:
        msystem: clangarm64
        update: true
        install: >-
          git
          base-devel
          wget
          p7zip
          mingw-w64-clang-aarch64-cmake
          mingw-w64-clang-aarch64-ninja
          mingw-w64-clang-aarch64-toolchain
          mingw-w64-clang-aarch64-qt6
          mingw-w64-clang-aarch64-boost
          mingw-w64-clang-aarch64-mpv
          mingw-w64-clang-aarch64-vulkan-loader
    - name: Avoid line ending issues on Windows
      run: git config --global core.autocrlf input
    - name: Download mpc-qt source
      uses: actions/checkout@v6.0.2
    - name: Download yt-dlp
      uses: robinraju/release-downloader@v1.13
      with:
        repository: "yt-dlp/yt-dlp"
        latest: true
        fileName: "yt-dlp.exe"
    - name: Set version
      run: |
        FORCE_VERSION=$( cat .github/actions/data/VERSION )
        echo "FORCE_VERSION=$( echo $FORCE_VERSION )" >> $GITHUB_ENV
    - name: Build
      run: |
        chmod +x scripts/*.sh
        bash scripts/make-release-msys2.sh
    - name: Diagnose startup crash
      continue-on-error: true
      run: |
        cd mpc-qt-win-arm64
        export QT_FORCE_STDERR_LOGGING=1
        export QT_LOGGING_RULES="*.debug=true;qt.*.debug=false"
        timeout 60 ./mpc-qt.exe > startup.log 2>&1
        echo "=== exit code: $? ==="
        cat startup.log
        echo "=== mpv-only check ==="
        ls -la libmpv-2.dll
    - name: Upload
      uses: actions/upload-artifact@v7
      with:
        name: "mpc-qt-win-arm64-${{ env.FORCE_VERSION }}"
        path: mpc-qt-*/
