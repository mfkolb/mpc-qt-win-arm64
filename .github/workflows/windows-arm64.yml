name: Msys2 CI (ARM64)

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  DEVBUILD: continuous
  MPCQT_SUFFIX: win-arm64
  # MSYS2 has no ARM64 NSIS package. The x64 one runs under emulation on the
  # ARM runner and produces an x64 installer, which Windows on ARM also runs
  # under emulation; it installs the native ARM64 files.
  MAKENSIS: /ucrt64/bin/makensis.exe

jobs:
  build:
    name: Build (Windows ARM64)
    runs-on: windows-11-arm
    defaults:
      run:
        shell: msys2 {0}

    steps:
    - name: Install packages
      uses: msys2/setup-msys2@v2
      with:
        msystem: clangarm64
        update: true
        install: >-
          git
          base-devel
          wget
          p7zip
          mingw-w64-clang-aarch64-cmake
          mingw-w64-clang-aarch64-ninja
          mingw-w64-clang-aarch64-toolchain
          mingw-w64-clang-aarch64-qt6
          mingw-w64-clang-aarch64-boost
          mingw-w64-clang-aarch64-mpv
          mingw-w64-clang-aarch64-vulkan-loader
          mingw-w64-ucrt-x86_64-nsis
    - name: Rebuild mpv with OpenGL enabled
      # MSYS2's ARM64 mpv package is built with -Dgl=disabled, but
      # mpc-qt draws video through mpv's OpenGL render API.
      run: |
        cd "$(cygpath -u "$RUNNER_TEMP")"
        git clone --depth 1 --filter=blob:none --sparse https://github.com/msys2/MINGW-packages mingw-packages
        cd mingw-packages
        git sparse-checkout set mingw-w64-mpv
        cd mingw-w64-mpv
        sed -i '/CARCH.*aarch64/,/^  fi$/d' PKGBUILD
        if grep -q "gl=disabled" PKGBUILD; then echo "failed to patch PKGBUILD"; exit 1; fi
        MINGW_ARCH=clangarm64 makepkg-mingw --syncdeps --noconfirm --skippgpcheck --nocheck
        pacman -U --noconfirm mingw-w64-clang-aarch64-mpv-*.pkg.tar.zst
    - name: Avoid line ending issues on Windows
      run: git config --global core.autocrlf input
    - name: Download mpc-qt source
      uses: actions/checkout@v6.0.2
    - name: Download yt-dlp
      uses: robinraju/release-downloader@v1.13
      with:
        repository: "yt-dlp/yt-dlp"
        latest: true
        fileName: "yt-dlp.exe"
    - name: Set version
      run: |
        FORCE_VERSION=$( cat .github/actions/data/VERSION )
        echo "FORCE_VERSION=$( echo $FORCE_VERSION )" >> $GITHUB_ENV
    - name: Build
      run: |
        chmod +x scripts/*.sh
        bash scripts/make-release-msys2.sh
    - name: Upload
      uses: actions/upload-artifact@v7
      with:
        name: "mpc-qt-win-arm64-${{ env.FORCE_VERSION }}"
        path: mpc-qt-*/
    - name: Rename installer
      run: mv build/mpc-qt-win-arm64-installer.exe build/mpc-qt-win-arm64-${{ env.FORCE_VERSION }}-installer.exe
    - name: Upload installer
      uses: actions/upload-artifact@v7
      with:
        name: "mpc-qt-win-arm64-installer"
        path: build/mpc-qt-win-arm64-*-installer.exe
